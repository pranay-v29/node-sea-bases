name: node-base-win64

# Kept outside .github/workflows on purpose so it never runs by itself. To run it,
# copy it into .github/workflows of a repo that has this folder at
# gh-workflows/node-base-images/ and extensions/node/.nvmrc.
#
# Builds the minimal 64-bit (x64) Node.js base for Windows. Node >= 23 ships no
# official 32-bit Windows build, so BrowserStackLocal 9.1.0 (Node 26) moves to x64.
# The Node version comes from extensions/node/.nvmrc. Output: a run artifact
# (.exe, .zip, SHA256SUMS) to download and upload to S3 by hand.
# Recipe: gh-workflows/node-base-images/scripts/windows (from 07souravkunda/jest-js-browserstack).
on:
  push:
    branches: [master]
    paths:
      - 'extensions/node/.nvmrc'
  workflow_dispatch:
    inputs:
      opt:
        description: 'Optimisation level: O1 (size) or O2 (speed: project default /Ox)'
        default: 'O1'

permissions:
  contents: read

jobs:
  win-x64:
    # Node 26's vcbuild needs Visual Studio 2022 with ClangCL; windows-2022 ships both.
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      OPT: ${{ inputs.opt || 'O1' }}
      ARCH: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node version from extensions/node/.nvmrc
        run: |
          NODE_VERSION=$(tr -d '[:space:]' < extensions/node/.nvmrc)
          [[ "$NODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$OPT" =~ ^(O1|O2)$ ]] || { echo "invalid version '$NODE_VERSION' or opt '$OPT'" >&2; exit 1; }
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install NASM (OpenSSL assembly)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Fetch and verify Node.js source
        run: |
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}.tar.gz"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          grep " node-v${NODE_VERSION}.tar.gz\$" SHASUMS256.txt | sha256sum -c -
          tar -xzf "node-v${NODE_VERSION}.tar.gz"

      - name: Build minimal Node.js (x64)
        shell: cmd
        run: call gh-workflows\node-base-images\scripts\windows\build.cmd

      - name: Smoke test
        run: |
          N="node-v${NODE_VERSION}/out/Release/node.exe"
          [ -f "$N" ] || N="node-v${NODE_VERSION}/Release/node.exe"
          "$N" -p "process.version + ' ' + process.arch + ' intl=' + typeof Intl + ' sea=' + !!process.getBuiltinModule('node:sea')"
          test "$("$N" -p process.arch)" = "x64"
          echo 'require("fs").writeFileSync("NODE_OPTIONS_WAS_HONOURED", "x")' > inject.js
          NODE_OPTIONS="--require ./inject.js" "$N" -e "0"
          if [ -f NODE_OPTIONS_WAS_HONOURED ]; then echo "NODE_OPTIONS was honoured" >&2; exit 1; fi
          mkdir -p out
          cp "$N" "out/node-v${NODE_VERSION}-minimal-win-x64.exe"

      - name: Checksums and size
        run: |
          cd out
          7z a -tzip -mx=9 "node-v${NODE_VERSION}-minimal-win-x64.zip" "node-v${NODE_VERSION}-minimal-win-x64.exe" > /dev/null
          sha256sum node-v* > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-v${{ env.NODE_VERSION }}-minimal-win-x64-${{ env.OPT }}
          path: out/
          retention-days: 30
